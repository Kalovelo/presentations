<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Kode+Mono:wght@400;700&display=swap" />
  <style>
    :root {
      --accent-400: #3ec9de;
      --accent-500: #10a0b9;
      --accent-600: #0c8499;
      --accent-700: #096b7d;
      --slate-50:  #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-500: #64748b;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'EB Garamond', serif;
      background: #ffffff;
      color: var(--slate-700);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 3rem 1.5rem;
      padding-top: 15vh;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-family: 'Kode Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--slate-800);
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: var(--slate-500);
      font-style: italic;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      display: block;
      text-decoration: none;
      padding: 0.5rem 0;
      transition: opacity 0.15s;
    }

    .card:hover {
      opacity: 0.7;
    }

    .card-tag {
      font-family: 'Kode Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-600);
      margin-bottom: 0.6rem;
    }

    .card-title {
      font-family: 'Kode Mono', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--slate-800);
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 1rem;
      color: var(--slate-500);
      line-height: 1.5;
    }

    .theme-toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: none;
      border: none;
      padding: 0.4rem;
      line-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--slate-400);
      cursor: pointer;
      transition: color 0.2s;
      z-index: 1000;
    }
    .theme-toggle:hover {
      color: var(--accent-500);
    }

    /* ── dark mode ── */
    [data-theme="dark"] body {
      background: var(--slate-900);
      color: var(--slate-200);
    }
    [data-theme="dark"] header h1 { color: var(--slate-100); }
    .site-logo { width: 2.5rem; height: 2.5rem; display: block; margin: 0 auto 1rem; fill: var(--slate-800); }
    [data-theme="dark"] .site-logo { fill: var(--slate-100); }
    [data-theme="dark"] .card-title { color: var(--slate-100); }
    [data-theme="dark"] .card-desc  { color: var(--slate-300); }
    [data-theme="dark"] .theme-toggle {
      color: var(--slate-300);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Kode Mono', monospace;
      font-size: 0.8rem;
      color: var(--slate-500);
    }

    footer a {
      color: var(--slate-500);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent-500);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle"></button>

  <header>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="234.464 236.489 199.028 183.621" class="site-logo" aria-hidden="true"><path d="M418.85 271.06c-6.12-11.03-14.83-20.59-25.22-27.45-.29-.19-.57-.37-.84-.46-.47-.37-.93-.65-1.4-.93a40.868 40.868 0 00-5.09-2.88c-.1-.09-.19-.09-.29-.09-1.02-.37-2.03-.74-3.06-.93-.54-.18-1.11-.27-1.66-.37-.83-.18-1.57-.28-2.41-.37-.66-.09-1.4-.09-2.05-.09-.83 0-1.67 0-2.49.09-12.63 1.3-22.55 11.87-22.55 24.86 0 2.32.37 4.54.93 6.68.28.83.55 1.67.83 2.41.09.09.09.28.19.37.47.93.92 1.85 1.39 2.69.19.46.46.93.74 1.39.09.09.19.19.29.37.27.37.45.74.74 1.02.37.46.74.93 1.11 1.39 1.48 2.04 3.05 3.62 4.82 5.2 4.82 4.73 9.46 9.27 13.73 14.37 4.17 5.01 8.16 10.58 10.57 17.16 2.5 6.4 3.24 13.63 2.78 20.87-.92 14.28-7.7 29.03-19.29 40.07-11.6 11.03-27.63 18.08-44.52 19.2-16.88 1.11-34.5-2.79-48.97-12.62-14.66-9.46-25.97-24.39-30.61-41.74-4.55-17.34-2.6-36.72 6.49-52.95 8.82-16.33 24.02-29.22 41.66-36.36.26-.19.45-.47.37-.84-.11-.37-.48-.55-.85-.37-18.27 6.03-35.05 18.09-45.63 34.88-5.38 8.34-9.37 17.62-11.49 27.54a84.81 84.81 0 00-.47 30.24c3.62 20.12 15.02 38.95 31.25 52.12 16.14 13.45 37.19 20.78 58.54 21.52 21.41.74 43.39-5.47 62.03-18.09 18.55-12.52 33.3-32.46 39.15-55.83 2.96-11.69 3.61-23.93 2.22-36.27-1.48-12.24-4.82-24.67-10.94-35.8z"/></svg>
    <h1>presentations</h1>
  </header>

  <div class="grid">
    <a class="card" href="k6/index.html">
      <div class="card-title">k6</div>
      <div class="card-desc">How to nuke (or load test) your services with k6</div>
    </a>
  </div>
  <footer>
    <a href="https://kalovelo.com" target="_blank">kalovelo.com</a>
  </footer>
  <script>
    const toggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    const SUN = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>`;
    const MOON = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    function applyTheme(theme) {
      root.dataset.theme = theme;
      toggle.innerHTML = theme === 'dark' ? SUN : MOON;
      toggle.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    }

    applyTheme(localStorage.getItem('theme') || 'light');

    toggle.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });
  </script>
</body>
</html>
